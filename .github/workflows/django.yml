name: Django CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Repository Files
        run: |
          echo "Current working directory:"
          pwd

          echo "GitHub workspace:"
          echo "$GITHUB_WORKSPACE"

          echo "Repository files:"
          ls -la "$GITHUB_WORKSPACE"

          echo "Locate requirements.txt:"
          find "$GITHUB_WORKSPACE" -name "requirements.txt"

          echo "Verify requirements.txt:"
          test -f "$GITHUB_WORKSPACE/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$GITHUB_WORKSPACE/requirements.txt"

      - name: Run Tests
        run: |
          python manage.py test
